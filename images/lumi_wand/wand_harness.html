svg.style.width = "100%"; svg.style.height = "100%";
const vb0 = svg.getAttribute("viewBox").split(/\s+/).map(Number);
let vb = vb0.slice();
const els = new Map();
for (const r of DATA.items) {
  els.set(r.id, Array.from(svg.querySelectorAll(`[id^="w_${sid(r.id)}_"]`)));
  for (const e of els.get(r.id)) e.classList.add("hit");
}
const KEY = "wiring-viewer:" + DATA.title;
let visible = new Set(DATA.items.map(r => r.id));
let focus = null;
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && Array.isArray(s.v)) visible = new Set(s.v.filter(i => R.has(i))); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify({ v: [...visible] })); } catch (e) {} }
const ghost = document.getElementById("ghost");
const sig = () => [...visible].sort().join("|");
function apply() {
  for (const r of DATA.items) {
    const on = visible.has(r.id), dim = focus !== null && focus !== r.id;
    for (const e of els.get(r.id)) {
      if (!on && !ghost.checked) { e.style.display = "none"; continue; }
      e.style.display = ""; e.style.opacity = !on ? 0.08 : (dim ? 0.12 : 1); e.style.pointerEvents = on ? "" : "none";
    }
    const cb = document.getElementById("cb" + sid(r.id)); if (cb) cb.checked = on;
    const row = document.getElementById("row" + sid(r.id)); if (row) row.classList.toggle("focus", focus === r.id);
  }
  DATA.groups.forEach((g, gi) => {
    const cb = document.getElementById("gcb" + gi), n = g.items.filter(i => visible.has(i)).length;
    cb.checked = n === g.items.length; cb.indeterminate = n > 0 && n < g.items.length;
  });
  document.getElementById("count").textContent = `${visible.size} of ${DATA.items.length} wires shown` + (focus !== null ? ` · focus ${focus}` : "");
  for (const b of document.querySelectorAll("#presets button")) b.classList.toggle("on", b.dataset.match === sig());
  save();
}
const pre = document.getElementById("presets");
for (const [name, ids] of [["All", DATA.items.map(r => r.id)], ["None", []], ...(DATA.presets || [])]) {
  const b = document.createElement("button"); b.textContent = name; b.dataset.match = [...ids].sort().join("|");
  b.onclick = () => { visible = new Set(ids); focus = null; apply(); }; pre.appendChild(b);
}
const inv = document.createElement("button"); inv.textContent = "Invert";
inv.onclick = () => { visible = new Set(DATA.items.map(r => r.id).filter(i => !visible.has(i))); apply(); }; pre.appendChild(inv);
const list = document.getElementById("list");
const swatch = cols => `<span class="sw">${cols.map(c => `<span style="background:${c}"></span>`).join("")}</span>`;
DATA.groups.forEach((g, gi) => {
  const d = document.createElement("div"); d.className = "h";
  d.innerHTML = `<div class="hrow"><span class="caret">▾</span><input type="checkbox" id="gcb${gi}"><span class="hname"></span>
    <span style="width:44px">${swatch([...new Set(g.items.map(i => R.get(i).colors).flat())])}</span></div><div class="routes"></div>`;
  d.querySelector(".hname").textContent = g.name;
  const box = d.querySelector(".routes");
  for (const i of g.items) {
    const r = R.get(i), row = document.createElement("div");
    row.className = "r"; row.id = "row" + sid(i);
    row.innerHTML = `<input type="checkbox" id="cb${sid(i)}">${swatch(r.colors)}<div class="rt"><b></b><div class="ft"></div></div>`;
    row.querySelector("b").textContent = r.label;
    row.querySelector(".ft").textContent = r.sub || "";
    row.querySelector("input").onclick = ev => { ev.stopPropagation(); ev.target.checked ? visible.add(i) : visible.delete(i); if (!ev.target.checked && focus === i) focus = null; apply(); };
    row.onclick = () => setFocus(i);
    box.appendChild(row);
  }
  d.querySelector(".caret").onclick = ev => { ev.stopPropagation(); d.classList.toggle("collapsed"); ev.target.textContent = d.classList.contains("collapsed") ? "▸" : "▾"; };
  d.querySelector("#gcb" + gi).onclick = ev => { ev.stopPropagation(); for (const i of g.items) ev.target.checked ? visible.add(i) : visible.delete(i); apply(); };
  d.querySelector(".hrow").onclick = () => {
    const only = g.items.every(i => visible.has(i)) && visible.size === g.items.length;
    visible = new Set(only ? DATA.items.map(r => r.id) : g.items); focus = null; apply();
  };
  list.appendChild(d);
});
function setFocus(i) {
  focus = focus === i ? null : i;
  if (focus !== null) { visible.add(focus); for (const e of els.get(focus)) e.parentNode.appendChild(e); }
  apply();
}
ghost.onchange = apply;
const tip = document.getElementById("tip"), stage = document.getElementById("stage");
const byS = new Map(DATA.items.map(r => [sid(r.id), r.id]));
function itemOf(t) { while (t && t !== svg) { const m = /^w_(.+)_\d+$/.exec(t.id || ""); if (m && byS.has(m[1])) return byS.get(m[1]); t = t.parentNode; } return null; }
stage.addEventListener("pointermove", ev => {
  if (drag) return;
  const i = itemOf(ev.target);
  if (i === null) { tip.style.display = "none"; return; }
  const r = R.get(i), b = stage.getBoundingClientRect();
  tip.innerHTML = ""; const t = document.createElement("div");
  const h = document.createElement("b"); h.textContent = r.label; t.appendChild(h);
  if (r.sub) { t.appendChild(document.createElement("br")); t.appendChild(document.createTextNode(r.sub)); }
  t.appendChild(document.createElement("br")); t.appendChild(document.createTextNode("(click to focus)"));
  tip.appendChild(t); tip.style.display = "block";
  let x = ev.clientX - b.left + 14, y = ev.clientY - b.top + 14;
  if (x + 340 > b.width) x = Math.max(4, ev.clientX - b.left - 350);
  tip.style.left = x + "px"; tip.style.top = y + "px";
});
stage.addEventListener("pointerleave", () => tip.style.display = "none");
// ---------- zoom + pan (viewBox)
function setVB() { svg.setAttribute("viewBox", vb.join(" ")); }
function toSvg(cx, cy) {
  const b = svg.getBoundingClientRect(), s = Math.max(vb[2] / b.width, vb[3] / b.height);
  const ox = (b.width * s - vb[2]) / 2, oy = (b.height * s - vb[3]) / 2;
  return [vb[0] - ox + (cx - b.left) * s, vb[1] - oy + (cy - b.top) * s, s];
}
function zoomAt(cx, cy, k) {
  const [x, y] = toSvg(cx, cy);
  const w = Math.min(vb0[2] * 1.5, Math.max(vb0[2] / 40, vb[2] * k)), f = w / vb[2];
  vb = [x - (x - vb[0]) * f, y - (y - vb[1]) * f, vb[2] * f, vb[3] * f]; setVB();
}
stage.addEventListener("wheel", ev => { ev.preventDefault(); zoomAt(ev.clientX, ev.clientY, Math.exp(ev.deltaY * 0.0015)); }, { passive: false });
let drag = null, moved = false;
const pts = new Map();
stage.addEventListener("pointerdown", ev => {
  pts.set(ev.pointerId, [ev.clientX, ev.clientY]);
  stage.setPointerCapture(ev.pointerId);
  drag = { x: ev.clientX, y: ev.clientY, vb: vb.slice(), d: pinchD() }; moved = false; stage.classList.add("drag");
});
function pinchD() { if (pts.size < 2) return 0; const [a, b] = [...pts.values()]; return Math.hypot(a[0] - b[0], a[1] - b[1]); }
stage.addEventListener("pointermove", ev => {
  if (!drag) return;
  pts.set(ev.pointerId, [ev.clientX, ev.clientY]);
  if (pts.size >= 2) {
    const d = pinchD(); if (drag.d && d) { const [a, b] = [...pts.values()]; zoomAt((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, drag.d / d); drag.d = d; }
    moved = true; return;
  }
  const s = toSvg(0, 0)[2], dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
  vb = [drag.vb[0] - dx * s, drag.vb[1] - dy * s, vb[2], vb[3]]; setVB();
});
function up(ev) {
  pts.delete(ev.pointerId);
  if (!drag) return;
  stage.classList.remove("drag");
  if (!moved && pts.size === 0) { const i = itemOf(ev.target); if (i !== null) setFocus(i); else if (focus !== null) { focus = null; apply(); } }
  drag = pts.size ? { x: [...pts.values()][0][0], y: [...pts.values()][0][1], vb: vb.slice(), d: 0 } : null;
}
stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
document.getElementById("zin").onclick = () => { const b = stage.getBoundingClientRect(); zoomAt(b.left + b.width / 2, b.top + b.height / 2, 0.7); };
document.getElementById("zout").onclick = () => { const b = stage.getBoundingClientRect(); zoomAt(b.left + b.width / 2, b.top + b.height / 2, 1 / 0.7); };
document.getElementById("fit").onclick = () => { vb = vb0.slice(); setVB(); };
apply();
</script>
