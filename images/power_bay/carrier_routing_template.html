<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carrier Wiring Map</title>
<!-- Generated by gen_carrier_figures.py (routing_html): the SVG and the route data are filled in at build time.
     Edit THIS template, never carrier_routing.html. -->
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --ink: #1d2433; --muted: #5d6677; --line: #dde1e8;
  --accent: #1f6fd0; --hover: #eef3fb; --paper: #ffffff; --chip: #eceff4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171c; --panel: #1c2027; --ink: #e6e9ef; --muted: #9aa3b2; --line: #2e343e;
    --accent: #6aa5ff; --hover: #252b35; --paper: #ffffff; --chip: #2a303a;
  }
}
:root[data-theme="dark"] {
  --bg: #14171c; --panel: #1c2027; --ink: #e6e9ef; --muted: #9aa3b2; --line: #2e343e;
  --accent: #6aa5ff; --hover: #252b35; --paper: #ffffff; --chip: #2a303a;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 13px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.app { display: grid; grid-template-columns: 380px 1fr; height: 100vh; }
aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.head { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
h1 { font-size: 16px; margin: 0 0 4px; }
.sub { color: var(--muted); font-size: 12px; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
button { font: inherit; font-size: 12px; padding: 5px 9px; border-radius: 6px; border: 1px solid var(--line);
         background: var(--chip); color: var(--ink); cursor: pointer; }
button:hover { border-color: var(--accent); }
button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.opts { display: flex; gap: 14px; padding: 8px 16px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; flex-wrap: wrap; }
.opts label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
.list { overflow: auto; flex: 1; padding: 6px 8px 16px; }
.h { border-radius: 8px; margin: 2px 0; }
.hrow { display: flex; align-items: center; gap: 8px; padding: 6px 8px; cursor: pointer; border-radius: 8px; }
.hrow:hover { background: var(--hover); }
.hname { font-weight: 600; flex: 1; }
.caret { width: 14px; color: var(--muted); user-select: none; }
.routes { padding: 0 0 4px 30px; }
.h.collapsed .routes { display: none; }
.r { display: grid; grid-template-columns: 16px 30px 1fr; gap: 6px; align-items: start; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
.r:hover { background: var(--hover); }
.r.focus { outline: 2px solid var(--accent); }
.sw { display: flex; height: 12px; margin-top: 2px; border-radius: 3px; overflow: hidden; border: 1px solid rgba(0,0,0,.25); }
.sw span { flex: 1; }
.rt { min-width: 0; }
.rt b { font-weight: 600; }
.rt .ft { color: var(--muted); font-size: 12px; }
input[type=checkbox] { accent-color: var(--accent); margin: 2px 0 0; cursor: pointer; }
main { position: relative; overflow: hidden; min-width: 0; }
#stage { position: absolute; inset: 0; background: var(--paper); cursor: grab; touch-action: none; }
#stage.drag { cursor: grabbing; }
#stage svg { width: 100%; height: 100%; display: block; }
.tools { position: absolute; right: 12px; top: 12px; display: flex; gap: 6px; z-index: 2; }
.tools button { background: var(--panel); min-width: 34px; }
#tip { position: absolute; pointer-events: none; z-index: 3; background: rgba(20,23,28,.94); color: #fff; padding: 7px 9px;
       border-radius: 6px; font-size: 12px; max-width: 340px; display: none; }
#tip b { font-weight: 600; }
.count { position: absolute; left: 12px; bottom: 10px; z-index: 2; background: var(--panel); color: var(--muted);
         border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: 12px; }
[id^="r"].hit { cursor: pointer; }
[id^="pin_"] { cursor: help; }
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 46vh 1fr; height: auto; min-height: 100vh; }
  aside { border-right: 0; border-bottom: 1px solid var(--line); min-height: 0; }
  main { height: 70vh; }
  .head, .presets, .opts { padding-left: 16px; padding-right: 16px; }
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="head">
      <h1>Power-bay carrier wiring</h1>
      <div class="sub">Current CAD layout, plain +Z top view, fans / back wall at the top. CAD wire colours; yellow squares = terminals.
        Tick to show / hide; click a route (here or on the map) to focus it. Hover a G469 pin for what lands on it.</div>
    </div>
    <div class="presets" id="presets"></div>
    <div class="opts">
      <label><input type="checkbox" id="ghost"> show hidden routes faint</label>
      <label><input type="checkbox" id="tags" checked> number tags</label>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <main>
    <div id="stage"><!--__SVG__-->
</div>
    <div class="tools">
      <button id="zin" title="Zoom in">+</button><button id="zout" title="Zoom out">&minus;</button><button id="fit" title="Fit the map">Fit</button>
    </div>
    <div class="count" id="count"></div>
    <div id="tip"></div>
  </main>
</div>
<script>
const DATA = /*__DATA__*/null;
const R = new Map(DATA.routes.map(r => [r.i, r]));
const svg = document.querySelector("#stage svg");
svg.removeAttribute("width"); svg.removeAttribute("height");
svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
const vb0 = svg.getAttribute("viewBox").split(/\s+/).map(Number);
let vb = vb0.slice();

// every artist of route i has id r<i>_<n>; the tag circles + numbers are the last two per tag
const els = new Map();
for (const r of DATA.routes) els.set(r.i, Array.from(svg.querySelectorAll(`[id^="r${r.i}_"]`)));
const tagEls = new Set();
for (const r of DATA.routes) for (const e of els.get(r.i)) e.classList.add("hit");
// tag circles: matplotlib draws a Circle as a closed bezier path; mark the circle that precedes each tag text
for (const r of DATA.routes) {
  const a = els.get(r.i);
  for (let k = 1; k < a.length; k++) if (a[k].querySelector("text")) tagEls.add(a[k - 1]);
}

const KEY = "carrier-wiring-v1";
let visible = new Set(DATA.routes.map(r => r.i));
let focus = null;
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && Array.isArray(s.v)) visible = new Set(s.v.filter(i => R.has(i))); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify({ v: [...visible] })); } catch (e) {} }

const ghost = document.getElementById("ghost"), tagsBox = document.getElementById("tags");
function apply() {
  for (const r of DATA.routes) {
    const on = visible.has(r.i);
    const dim = focus !== null && focus !== r.i;
    for (const e of els.get(r.i)) {
      const isTag = tagEls.has(e);
      if (!on && !ghost.checked) { e.style.display = "none"; continue; }
      if (isTag && !tagsBox.checked) { e.style.display = "none"; continue; }
      e.style.display = "";
      e.style.opacity = !on ? (isTag ? 0 : 0.08) : (dim ? 0.1 : 1);
      e.style.pointerEvents = on ? "" : "none";
    }
  }
  for (const r of DATA.routes) {
    const cb = document.getElementById("cb" + r.i); if (cb) cb.checked = visible.has(r.i);
    const row = document.getElementById("row" + r.i); if (row) row.classList.toggle("focus", focus === r.i);
  }
  DATA.harness.forEach((h, hi) => {
    const cb = document.getElementById("hcb" + hi), n = h.routes.filter(i => visible.has(i)).length;
    cb.checked = n === h.routes.length; cb.indeterminate = n > 0 && n < h.routes.length;
  });
  document.getElementById("count").textContent = `${visible.size} of ${DATA.routes.length} routes shown` + (focus !== null ? ` · focus #${focus}` : "");
  for (const b of document.querySelectorAll("#presets button")) b.classList.toggle("on", b.dataset.match === sig());
  save();
}
function sig() { return [...visible].sort((a, b) => a - b).join(","); }
// raise a route above the others while it has focus
function raise(i) { for (const e of els.get(i)) e.parentNode.appendChild(e); }

// ---------- sidebar
const PRE = [
  ["All", () => DATA.routes.map(r => r.i)],
  ["None", () => []],
  ["Power", () => DATA.routes.filter(r => r.fam === "power").map(r => r.i)],
  ["Signal", () => DATA.routes.filter(r => r.fam === "signal").map(r => r.i)],
  ["Mains", () => DATA.routes.filter(r => r.mains).map(r => r.i)],
  ["12 V + battery", () => DATA.routes.filter(r => /^(12 V main|battery)/.test(DATA.harness[r.h].name)).map(r => r.i)],
  ["To the riser", () => DATA.routes.filter(r => /riser/.test(r.from + r.to)).map(r => r.i)],
  ["G469", () => DATA.routes.filter(r => /G469/.test(r.from + r.to)).map(r => r.i)],
];
const pre = document.getElementById("presets");
for (const [name, f] of PRE) {
  const b = document.createElement("button"); b.textContent = name; b.dataset.match = f().sort((a, b) => a - b).join(",");
  b.onclick = () => { visible = new Set(f()); focus = null; apply(); }; pre.appendChild(b);
}
const inv = document.createElement("button"); inv.textContent = "Invert";
inv.onclick = () => { visible = new Set(DATA.routes.map(r => r.i).filter(i => !visible.has(i))); apply(); }; pre.appendChild(inv);

const list = document.getElementById("list");
function swatch(cols) { return `<span class="sw">${cols.map(c => `<span style="background:${c}"></span>`).join("")}</span>`; }
DATA.harness.forEach((h, hi) => {
  const d = document.createElement("div"); d.className = "h";
  const cols = h.routes.map(i => R.get(i).colors).flat();
  d.innerHTML = `<div class="hrow"><span class="caret">▾</span><input type="checkbox" id="hcb${hi}"><span class="hname"></span>
    <span style="width:44px">${swatch([...new Set(cols)])}</span></div><div class="routes"></div>`;
  d.querySelector(".hname").textContent = h.name;
  const box = d.querySelector(".routes");
  for (const i of h.routes) {
    const r = R.get(i), row = document.createElement("div");
    row.className = "r"; row.id = "row" + i;
    row.innerHTML = `<input type="checkbox" id="cb${i}">${swatch(r.colors)}<div class="rt"><b></b><div class="ft"></div></div>`;
    row.querySelector("b").textContent = `#${i}  ${r.rid}  ·  ${r.cond}  ·  ${r.plan} mm routed`;
    row.querySelector(".ft").textContent = `${r.from} → ${r.to}`;
    row.querySelector("input").onclick = ev => { ev.stopPropagation(); ev.target.checked ? visible.add(i) : visible.delete(i); if (!ev.target.checked && focus === i) focus = null; apply(); };
    row.onclick = () => setFocus(i);
    box.appendChild(row);
  }
  d.querySelector(".caret").onclick = ev => { ev.stopPropagation(); d.classList.toggle("collapsed"); ev.target.textContent = d.classList.contains("collapsed") ? "▸" : "▾"; };
  d.querySelector("#hcb" + hi).onclick = ev => { ev.stopPropagation(); for (const i of h.routes) ev.target.checked ? visible.add(i) : visible.delete(i); apply(); };
  d.querySelector(".hrow").onclick = () => { // click the harness name: show only this harness
    const only = h.routes.every(i => visible.has(i)) && visible.size === h.routes.length;
    visible = new Set(only ? DATA.routes.map(r => r.i) : h.routes); focus = null; apply();
  };
  list.appendChild(d);
});
function setFocus(i) {
  focus = focus === i ? null : i;
  if (focus !== null) { visible.add(focus); raise(focus); }
  apply();
}
ghost.onchange = apply; tagsBox.onchange = apply;

// ---------- map: hover info, click to focus
const tip = document.getElementById("tip"), stage = document.getElementById("stage");
function routeOf(t) { while (t && t !== svg) { const m = /^r(\d+)_/.exec(t.id || ""); if (m) return +m[1]; t = t.parentNode; } return null; }
stage.addEventListener("pointermove", ev => {
  if (drag) return;
  const i = routeOf(ev.target);
  if (i === null) { pinTip(ev); return; }
  const r = R.get(i), b = stage.getBoundingClientRect();
  tip.innerHTML = ""; const t = document.createElement("div");
  t.innerHTML = `<b></b><br><span></span><br><span></span>`;
  t.querySelector("b").textContent = `#${i} ${r.rid} — ${DATA.harness[r.h].name}`;
  t.querySelectorAll("span")[0].textContent = `${r.from} → ${r.to}`;
  t.querySelectorAll("span")[1].textContent = `${r.cond}, routed ${r.plan} mm (click to focus)`;
  tip.appendChild(t); tip.style.display = "block";
  let x = ev.clientX - b.left + 14, y = ev.clientY - b.top + 14;
  if (x + 340 > b.width) x = Math.max(4, ev.clientX - b.left - 350);
  tip.style.left = x + "px"; tip.style.top = y + "px";
});
function pinOf(t) { while (t && t !== svg) { const m = /^pin_(\d+)_/.exec(t.id || ""); if (m) return m[1]; t = t.parentNode; } return null; }
function pinTip(ev) {
  const p = pinOf(ev.target);
  if (p === null || !DATA.pins[p]) { tip.style.display = "none"; return; }
  const q = DATA.pins[p], b = stage.getBoundingClientRect();
  tip.innerHTML = ""; const t = document.createElement("div");
  const head = document.createElement("b"); head.textContent = `G469 pin ${p} · ${q.name}` + (q.sig && q.sig !== q.name ? ` (${q.sig})` : "");
  t.appendChild(head);
  for (const line of (q.land.length ? q.land : ["nothing lands here"])) { t.appendChild(document.createElement("br")); t.appendChild(document.createTextNode(line)); }
  tip.appendChild(t); tip.style.display = "block";
  let x = ev.clientX - b.left + 14, y = ev.clientY - b.top + 14;
  if (x + 340 > b.width) x = Math.max(4, ev.clientX - b.left - 350);
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
stage.addEventListener("pointerleave", () => tip.style.display = "none");

// ---------- zoom + pan (viewBox)
function setVB() { svg.setAttribute("viewBox", vb.join(" ")); }
function toSvg(cx, cy) {
  const b = svg.getBoundingClientRect(), s = Math.max(vb[2] / b.width, vb[3] / b.height);
  const ox = (b.width * s - vb[2]) / 2, oy = (b.height * s - vb[3]) / 2;
  return [vb[0] - ox + (cx - b.left) * s, vb[1] - oy + (cy - b.top) * s, s];
}
function zoomAt(cx, cy, k) {
  const [x, y] = toSvg(cx, cy);
  const w = Math.min(vb0[2] * 1.5, Math.max(vb0[2] / 40, vb[2] * k)), f = w / vb[2];
  vb = [x - (x - vb[0]) * f, y - (y - vb[1]) * f, vb[2] * f, vb[3] * f]; setVB();
}
stage.addEventListener("wheel", ev => { ev.preventDefault(); zoomAt(ev.clientX, ev.clientY, Math.exp(ev.deltaY * 0.0015)); }, { passive: false });
let drag = null, moved = false;
const pts = new Map();
stage.addEventListener("pointerdown", ev => {
  pts.set(ev.pointerId, [ev.clientX, ev.clientY]);
  stage.setPointerCapture(ev.pointerId);
  drag = { x: ev.clientX, y: ev.clientY, vb: vb.slice(), d: pinchD() }; moved = false; stage.classList.add("drag");
});
function pinchD() { if (pts.size < 2) return 0; const [a, b] = [...pts.values()]; return Math.hypot(a[0] - b[0], a[1] - b[1]); }
stage.addEventListener("pointermove", ev => {
  if (!drag) return;
  pts.set(ev.pointerId, [ev.clientX, ev.clientY]);
  if (pts.size >= 2) {
    const d = pinchD(); if (drag.d && d) { const [a, b] = [...pts.values()]; zoomAt((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, drag.d / d); drag.d = d; }
    moved = true; return;
  }
  const s = toSvg(0, 0)[2], dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
  vb = [drag.vb[0] - dx * s, drag.vb[1] - dy * s, vb[2], vb[3]]; setVB();
});
function up(ev) {
  pts.delete(ev.pointerId);
  if (!drag) return;
  stage.classList.remove("drag");
  if (!moved && pts.size === 0) { const i = routeOf(ev.target); if (i !== null) setFocus(i); else if (focus !== null) { focus = null; apply(); } }
  drag = pts.size ? { x: [...pts.values()][0][0], y: [...pts.values()][0][1], vb: vb.slice(), d: 0 } : null;
}
stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
document.getElementById("zin").onclick = () => { const b = stage.getBoundingClientRect(); zoomAt(b.left + b.width / 2, b.top + b.height / 2, 0.7); };
document.getElementById("zout").onclick = () => { const b = stage.getBoundingClientRect(); zoomAt(b.left + b.width / 2, b.top + b.height / 2, 1 / 0.7); };
document.getElementById("fit").onclick = () => { vb = vb0.slice(); setVB(); };
apply();
</script>
</body>
</html>
