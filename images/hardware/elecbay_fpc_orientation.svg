<text x="1068.0" y="790.0" font-size="12.5" text-anchor="start" font-weight="700" fill="none" stroke="#fff" stroke-width="3.6" stroke-linejoin="round">Rotated 180° (FPC end AWAY from the STM32) = pin 1 ↔ pin 40, end-to-end:</text>
<text x="1068.0" y="790.0" font-size="12.5" text-anchor="start" font-weight="700" fill="#7f1d0e">Rotated 180° (FPC end AWAY from the STM32) = pin 1 ↔ pin 40, end-to-end:</text>
<text x="1068.0" y="818.0" font-size="11.5" text-anchor="start" font-weight="400" fill="none" stroke="#fff" stroke-width="3.6" stroke-linejoin="round">• the WHOLE chain shifts — every G469 terminal carries pin 41−n</text>
<text x="1068.0" y="818.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#7f1d0e">• the WHOLE chain shifts — every G469 terminal carries pin 41−n</text>
<text x="1068.0" y="841.0" font-size="11.5" text-anchor="start" font-weight="400" fill="none" stroke="#fff" stroke-width="3.6" stroke-linejoin="round">• step-5 symptom: G469 “3V3” terminal reads a floating GPIO level, NOT 3.3 V</text>
<text x="1068.0" y="841.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#7f1d0e">• step-5 symptom: G469 “3V3” terminal reads a floating GPIO level, NOT 3.3 V</text>
<text x="1068.0" y="864.0" font-size="11.5" text-anchor="start" font-weight="400" fill="none" stroke="#fff" stroke-width="3.6" stroke-linejoin="round">• fix: power OFF, lift the breakout, rotate 180°, re-seat, re-test</text>
<text x="1068.0" y="864.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#7f1d0e">• fix: power OFF, lift the breakout, rotate 180°, re-seat, re-test</text>
<text x="1068.0" y="887.0" font-size="11.5" text-anchor="start" font-weight="400" fill="none" stroke="#fff" stroke-width="3.6" stroke-linejoin="round">• do NOT re-wire anything to match — the rotation is the fault</text>
