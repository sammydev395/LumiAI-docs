<text x="128.0" y="818.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#0d5c33">1.  Tall header onto the Pi5 GPIO first — fully seated, no gap.  Pin 1 = the square-pad corner pin at the SD-card end.</text>
<text x="128.0" y="841.0" font-size="11.5" text-anchor="start" font-weight="400" fill="none" stroke="#fff" stroke-width="3.6" stroke-linejoin="round">2.  Invert the breakout (socket face DOWN), rotate until the FPC connector end points at the STM32, press flush.</text>
<text x="128.0" y="841.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#0d5c33">2.  Invert the breakout (socket face DOWN), rotate until the FPC connector end points at the STM32, press flush.</text>
